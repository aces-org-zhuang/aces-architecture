name: architecture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This layer pulls in project design repos as submodules.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the pinned likec4 engines requirement.
          # LikeC4 1.58.x works on 22.22.x; check package.json engines.
          node-version: '22.22.2'
          cache: npm

      - run: npm ci

      # Verify every registered project design repo is actually present.
      - name: Check project registry is synced
        run: npm run sync:check

      - name: Validate model
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Build static site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: likec4-site
          path: ./dist
          retention-days: 7

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
